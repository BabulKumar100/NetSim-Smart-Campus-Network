[build]
  # Run pnpm through Corepack so the build works even when pnpm isn't on PATH.
  # The version comes from the "packageManager" field in package.json.
  command = "corepack pnpm install --frozen-lockfile && corepack pnpm run build"
  publish = "dist"

[build.environment]
  COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"
